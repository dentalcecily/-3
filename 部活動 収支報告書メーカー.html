<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>部活動 収支報告書メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F3A5F;      /* 藍インク */
  --paper:#FBFCFD;
  --rule:#D5DDE5;
  --in:#2E7D5B;       /* 収入 */
  --out:#B23A3A;      /* 支出 */
  --muted:#5E6B7A;
  --bg:#EEF2F6;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #6FA3D8;outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header.top{background:var(--ink);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;padding:12px 16px}
header.top h1{font-family:"Shippori Mincho",serif;font-size:1.25rem;margin:0;flex:1}
header.top .navbtn{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;font-size:.9rem}
.btn{border:1px solid var(--ink);background:#fff;border-radius:6px;padding:8px 14px}
.btn.primary{background:var(--ink);color:#fff}
.btn.in{background:var(--in);border-color:var(--in);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{border-color:var(--out);color:var(--out)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;color:var(--muted)}
.field input,.field select{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:#fff}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:8px 0 16px;overflow-x:auto}
.tabs button{padding:10px 16px;border:none;background:transparent;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap}
.tabs button.active{background:var(--ink);color:#fff}
.tabs button.t-in.active{background:var(--in)}
.tabs button.t-out.active{background:var(--out)}
#dlg{position:fixed;inset:0;background:rgba(15,25,40,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#dlg .box{background:#fff;border-radius:10px;padding:20px;max-width:420px;width:100%}
#dlg p{margin:0 0 16px;white-space:pre-wrap}
#dlg .row-actions{justify-content:flex-end;margin:0}
.drop{border:2px dashed var(--rule);border-radius:10px;padding:28px 16px;text-align:center;background:#fff}
.drop.in{border-color:var(--in)} .drop.out{border-color:var(--out)}
.drop.over{background:#F3F8FC}
.drop p{margin:6px 0;color:var(--muted)}
.queue{list-style:none;padding:0;margin:12px 0 0;font-size:.9rem}
.queue li{padding:4px 0;border-bottom:1px dotted var(--rule)}
.ok{color:var(--in)} .ng{color:var(--out)}
.tablewrap{overflow-x:auto}
table.rows{width:100%;border-collapse:collapse;min-width:560px}
table.rows th{font-size:.8rem;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--ink)}
table.rows td{padding:4px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.rows input{width:100%;border:1px solid transparent;border-radius:4px;padding:6px;background:transparent}
table.rows input:hover,table.rows input:focus{border-color:var(--rule);background:#fff}
table.rows input.amt{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--rule);cursor:zoom-in;display:block}
.tag{font-size:.7rem;padding:1px 6px;border-radius:10px;background:#E4EAF0;color:var(--muted);white-space:nowrap}
.tag.auto{background:#E2F1EA;color:var(--in)}
.sum{display:flex;justify-content:flex-end;gap:16px;align-items:baseline;margin-top:12px;font-size:1.05rem}
.sum strong{font-size:1.4rem;font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.totals div{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.totals span{display:block;font-size:.8rem;color:var(--muted)}
.totals b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.list .name{flex:1;min-width:180px}
.list .name b{font-size:1.05rem}
.list .name small{display:block;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
.note{font-size:.85rem;color:var(--muted)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#modal{position:fixed;inset:0;background:rgba(15,25,40,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal img{max-width:100%;max-height:90vh;border-radius:6px;background:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:60;font-size:.9rem}

/* ===== 提出用シート（原本PDFと同一のレイアウト：A4横） ===== */
.sheetwrap{width:100%;overflow:hidden;margin-bottom:16px}
.page{position:relative;width:841.89pt;height:595.28pt;background:#fff;transform-origin:top left;
  box-shadow:0 0 0 1px var(--rule);margin-bottom:16px;color:#000;
  font-family:"MS Mincho","ＭＳ 明朝","Yu Mincho","游明朝","Hiragino Mincho ProN","Shippori Mincho",serif}
.page img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}
.page .f{position:absolute;white-space:nowrap;overflow:hidden;line-height:1;display:flex;align-items:center}
.page .f.c{justify-content:center} .page .f.r{justify-content:flex-end}
.page .f span{display:inline-block}
.pageinfo{font-size:.85rem;color:var(--muted);margin:0 0 6px}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff;margin:0;padding:0}
  .no-print{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  .sheetwrap{width:auto!important;height:auto!important;overflow:visible;margin:0}
  .page{transform:none!important;box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page img.bg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top no-print">
  <div class="wrap">
    <h1>収支報告書メーカー</h1>
    <button type="button" class="navbtn" data-go="home">報告書一覧</button>
    <button type="button" class="navbtn" data-go="settings">バックアップ</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modal" class="no-print"><img alt="証憑画像"></div>
<div id="toast" class="no-print"></div>
<div id="dlg" class="no-print" role="dialog" aria-modal="true"><div class="box"><p id="dlgMsg"></p>
  <div class="row-actions"><button type="button" class="btn" id="dlgNo">キャンセル</button><button type="button" class="btn danger" id="dlgYes">削除する</button></div></div></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* =========================================================
   データ保存（ブラウザの localStorage に自動保存）
   ========================================================= */
const STORE_KEY = 'clubReportMaker_v1';
const DEFAULT_MODEL = 'claude-sonnet-5-5';

let storageOK = true;
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ storageOK = false; return null; } }
function lsSet(k,v){ window.localStorage.setItem(k,v); }
function loadDB(){
  try{
    const raw = lsGet(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); d.reports ||= {}; d.settings ||= {}; return d; }
  }catch(e){ console.error(e); }
  return { reports:{}, settings:{ apiKey:'', model:DEFAULT_MODEL, mode:'total' } };
}
let db = loadDB();
function saveDB(){
  try{ lsSet(STORE_KEY, JSON.stringify(db)); }
  catch(e){
    if(e && e.name === 'QuotaExceededError') toast('保存容量がいっぱいです。設定画面からバックアップを書き出し、古い報告書を削除してください。');
    else if(!saveDB._warned){ saveDB._warned = true; toast('この表示環境では入力内容を保存できません。Claudeで開いたリンクから使ってください。'); }
  }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => (Number(n)||0).toLocaleString('ja-JP');
const toNum = v => { const n = parseInt(String(v).replace(/[^\d-]/g,''),10); return isNaN(n) ? 0 : n; };
const sum = rows => rows.reduce((a,r)=>a+(toNum(r.amount)),0);

function currentFiscalYear(){
  const d = new Date(); return d.getMonth() < 3 ? d.getFullYear()-1 : d.getFullYear();
}
function touch(r){ r.updatedAt = Date.now(); saveDB(); }

function askConfirm(msg, yesLabel='削除する'){
  return new Promise(res=>{
    const d = document.getElementById('dlg');
    document.getElementById('dlgMsg').textContent = msg;
    const yes = document.getElementById('dlgYes'), no = document.getElementById('dlgNo');
    yes.textContent = yesLabel;
    const close = v => { d.style.display='none'; yes.onclick = no.onclick = null; res(v); };
    yes.onclick = ()=>close(true); no.onclick = ()=>close(false);
    d.style.display = 'flex'; no.focus();
  });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display='none', 3500);
}

/* =========================================================
   画像の圧縮（送信量と保存量を減らす）
   ========================================================= */
function readAsDataURL(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result); fr.onerror = ()=>rej(fr.error);
    fr.readAsDataURL(file);
  });
}
async function fileToImage(file){
  // ① createImageBitmap（向きの補正つき）
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, { imageOrientation:'from-image' }); }catch(e){}
    try{ return await createImageBitmap(file); }catch(e){}
  }
  // ② data URL 経由で <img> に読み込む
  const url = await readAsDataURL(file);
  return await new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = ()=>rej(new Error('decode'));
    img.src = url;
  });
}
function resize(img, max, quality){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const scale = Math.min(1, max / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.round(iw*scale); c.height = Math.round(ih*scale);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', quality);
}

/* =========================================================
   Claude API でレシート・領収書・請求書を読み取る
   ========================================================= */
// Claudeの機能を取得（このページをClaudeのリンクから開いたときに使える）
const capReady = {};
function getCap(name){
  if(!(name in capReady)){
    capReady[name] = (window.claude && typeof window.claude.use === 'function')
      ? window.claude.use(name).catch(()=>null) : Promise.resolve(null);
  }
  return capReady[name];
}
function dataURLtoBlob(url){
  const [head, b64] = url.split(',');
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: head.match(/:(.*?);/)[1] });
}
async function showCapStatus(){
  const el = () => document.getElementById('capStatus');
  if(el()) el().textContent = '読み取り機能を準備中…';
  const sample = await getCap('sample');
  let msg;
  if(!sample) msg = '⚠ 読み取り機能が使えません。Claudeのアプリまたはclaude.aiで、このアプリのリンクを開いてください。';
  else{
    const lim = await sample.limits().catch(()=>null);
    msg = (lim && lim.images) ? '✓ 読み取りの準備ができています。初回は「許可」の確認が出ます。'
                              : '⚠ この画面では画像を送れません。パソコンのブラウザ（claude.ai）で開き直してください。';
  }
  if(el()) el().textContent = msg;
}
const SAMPLE_ERR = {
  not_granted:'Claudeの利用が許可されませんでした。ページを開き直して「許可」を選んでください。',
  sampling_disabled:'このアカウントでは読み取り機能を使えません。',
  images_unavailable:'この画面では画像を読み取れません。',
  image_rejected:'この画像は読み取れません。JPEGかPNGで撮り直してください。',
  rate_limited:'読み取りが混み合っています。少し待ってからもう一度試してください。',
  session_expired:'Claudeに再ログインしてください。',
  invalid_json:'読み取り結果を解釈できませんでした。もう一度試すか手入力してください。',
  refused:'この画像は読み取れませんでした。手入力してください。'
};

async function readReceipt(image, kind){
  const sample = await getCap('sample');
  if(!sample) throw new Error('読み取り機能が使えません。このアプリはClaudeで開いたリンクから使ってください。');
  const kindJa = kind === 'income' ? '収入' : '支出';
  const prompt =
`添付画像は大学の部活動の「${kindJa}」の証憑（レシート・領収書・請求書のいずれか）です。
内容を読み取り、次の形のJSONだけを返してください。

{"docType":"レシート|領収書|請求書","issuer":"発行者・店名","date":"YYYY-MM-DD または空文字","summary":"収支報告書の項目欄に書く短い名称（例：文房具代、合宿宿泊費、部費、協賛金）","total":税込合計の整数,"items":[{"name":"品目名","amount":税込金額の整数}]}

ルール：
- 金額は円の整数（カンマ・円記号なし）。合計は「合計」「ご請求金額」「領収金額」など最終的な支払額を採用。
- 読み取れない値は空文字または0にする。`;
  try{
    return await sample.json(prompt, { images: (typeof image === 'string') ? dataURLtoBlob(image) : image, cache:false });
  }catch(e){
    throw new Error((SAMPLE_ERR[e && e.code] || '読み取りに失敗しました。もう一度試すか手入力してください。') + (e && e.code ? `［${e.code}］` : ''));
  }
}

/* =========================================================
   画面描画（ルーティング）
   ========================================================= */
const app = document.getElementById('app');
let route = { page:'home', id:null, tab:'income' };

function go(page, id=null, tab='income'){
  route = { page, id, tab };
  try{ sessionStorage.setItem(STORE_KEY+'_route', JSON.stringify(route)); }catch(e){}
  render();
  window.scrollTo(0,0);
}
// data-go 属性のボタンはすべてここで処理（画面切り替え）
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go]');
  if(!b) return;
  e.preventDefault();
  go(b.dataset.go, b.dataset.id || null, b.dataset.tab || 'income');
});

function render(){
  if(route.page === 'settings') return renderSettings();
  if(route.page === 'report' && db.reports[route.id]) return renderReport(db.reports[route.id], route.tab || 'income');
  route.page = 'home';
  renderHome();
}

/* ---------- 一覧・新規作成 ---------- */
function renderHome(){
  const list = Object.values(db.reports).sort((a,b)=>b.updatedAt-a.updatedAt);
  app.innerHTML = `
  <section class="panel">
    <h2 style="margin:0 0 4px;font-family:'Shippori Mincho',serif">新しい収支報告書をつくる</h2>
    <p class="note" style="margin:0 0 12px">年度と部の名前を入れて作成します。あとから変更もできます。</p>
    <div class="grid3">
      <div class="field"><label for="nYear">年度</label><input id="nYear" value="${currentFiscalYear()}"></div>
      <div class="field"><label for="nClub">部</label><input id="nClub" placeholder="例：軽音楽"></div>
    </div>
    <button type="button" class="btn primary" id="createBtn">新規作成</button>
  </section>
  <section class="panel">
    <h2 style="margin:0 0 8px;font-size:1.1rem">作成中・作成済みの報告書</h2>
    ${list.length ? `<ul class="list">${list.map(r=>`
      <li>
        <div class="name"><b>${esc(r.year)}年度 ${esc(r.club)}部</b>
          <small>収入 ${yen(sum(r.income))}円／支出 ${yen(sum(r.expense))}円／残高 ${yen(sum(r.income)-sum(r.expense))}円・最終更新 ${new Date(r.updatedAt).toLocaleString('ja-JP')}</small></div>
        <button type="button" class="btn primary" data-go="report" data-id="${r.id}" data-tab="income">続きを編集</button>
        <button type="button" class="btn" data-dup="${r.id}">部名を引き継いで次年度を作成</button>
        <button type="button" class="btn danger" data-del="${r.id}">削除</button>
      </li>`).join('')}</ul>`
      : `<p class="empty">まだ報告書がありません。上のフォームから作成してください。</p>`}
  </section>`;

  document.getElementById('createBtn').onclick = ()=>{
    const r = newReport(document.getElementById('nYear').value.trim(), document.getElementById('nClub').value.trim());
    go('report', r.id, 'income');
  };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const r = db.reports[b.dataset.del];
    if(await askConfirm(`「${r.year}年度 ${r.club}部」の報告書を削除します。元に戻せません。よろしいですか？`)){
      delete db.reports[b.dataset.del]; saveDB(); render(); toast('削除しました');
    }
  });
  app.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{
    const src = db.reports[b.dataset.dup];
    const y = toNum(src.year) ? String(toNum(src.year)+1) : '';
    const r = newReport(y, src.club, src.leader);
    go('report', r.id, 'income');
  });
}

function newReport(year, club, leader=''){
  const r = { id:uid(), year:year||String(currentFiscalYear()), club:club||'', leader,
              income:[], expense:[], createdAt:Date.now(), updatedAt:Date.now() };
  db.reports[r.id] = r; saveDB(); return r;
}

/* ---------- 報告書編集 ---------- */
function renderReport(r, tab){
  const tIn = sum(r.income), tOut = sum(r.expense);
  app.innerHTML = `
  <div class="no-print">
    <div class="panel">
      <div class="grid3">
        <div class="field"><label for="fYear">年度</label><input id="fYear" data-head="year" value="${esc(r.year)}"></div>
        <div class="field"><label for="fClub">部</label><input id="fClub" data-head="club" value="${esc(r.club)}" placeholder="例：軽音楽"></div>
        <div class="field"><label for="fLeader">部長（任意）</label><input id="fLeader" data-head="leader" value="${esc(r.leader)}"></div>
      </div>
      <p class="note" style="margin:0">入力内容はすべて自動保存されます。ページを閉じても次回この続きから編集できます。</p>
    </div>
    <div class="totals">
      <div><span>収入合計</span><b class="ok" id="vIn">${yen(tIn)}円</b></div>
      <div><span>支出合計</span><b class="ng" id="vOut">${yen(tOut)}円</b></div>
      <div><span>残高</span><b id="vBal">${yen(tIn-tOut)}円</b></div>
    </div>
    <nav class="tabs">
      <button type="button" data-go="report" data-id="${r.id}" data-tab="income" class="t-in ${tab==='income'?'active':''}">収入の証憑を読み込む</button>
      <button type="button" data-go="report" data-id="${r.id}" data-tab="expense" class="t-out ${tab==='expense'?'active':''}">支出の証憑を読み込む</button>
      <button type="button" data-go="report" data-id="${r.id}" data-tab="sheet" class="${tab==='sheet'?'active':''}">報告書を確認・印刷</button>
    </nav>
  </div>
  <div id="tabBody"></div>`;

  app.querySelectorAll('[data-head]').forEach(inp=>inp.addEventListener('input',()=>{
    r[inp.dataset.head] = inp.value; touch(r);
  }));

  const body = document.getElementById('tabBody');
  if(tab === 'sheet') renderSheet(r, body);
  else renderEntry(r, tab === 'expense' ? 'expense' : 'income', body);
}

function updateTotals(r){
  const tIn = sum(r.income), tOut = sum(r.expense);
  const s = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent = yen(v)+'円'; };
  s('vIn',tIn); s('vOut',tOut); s('vBal',tIn-tOut); s('vTab', sum(r[updateTotals.kind]||[]));
}

function renderEntry(r, kind, body){
  updateTotals.kind = kind;
  const ja = kind==='income' ? '収入' : '支出';
  const rows = r[kind];
  body.innerHTML = `
  <section class="panel">
    <div class="drop ${kind==='income'?'in':'out'}" id="drop">
      <p style="font-size:1.05rem;color:var(--ink)"><b>${ja}</b>のレシート・領収書・請求書の画像を選択</p>
      <p>ここにドラッグ＆ドロップ、または下のボタンから選択（複数可）</p>
      <div class="row-actions" style="justify-content:center">
        <label class="btn ${kind==='income'?'in':'out'}">画像を選ぶ<input type="file" id="fileIn" accept="image/*" multiple hidden></label>
        <label class="btn">カメラで撮影<input type="file" id="camIn" accept="image/*" capture="environment" hidden></label>
      </div>
      <p class="note">このページで読み込んだ画像はすべて「${ja}の部」に記入されます。</p>
    </div>
    <p class="note" id="capStatus" style="margin:10px 0 0"></p>
    <ul class="queue" id="queue"></ul>
  </section>

  <section class="panel">
    <h2 style="margin:0 0 8px;font-size:1.1rem">${ja}の部</h2>
    <div class="tablewrap">
      <table class="rows">
        <thead><tr><th style="width:56px">証憑</th><th>項目</th><th style="width:140px">金額（円）</th><th>備考</th><th style="width:60px"></th><th style="width:40px"></th></tr></thead>
        <tbody>${rows.length ? rows.map(row=>rowHTML(row)).join('') :
          `<tr><td colspan="6" class="empty">まだ記入がありません。画像を読み込むか「行を追加」で手入力してください。</td></tr>`}</tbody>
      </table>
    </div>
    <div class="row-actions"><button type="button" class="btn" id="addRow">行を追加（手入力）</button></div>
    <div class="sum">${ja}合計 <strong id="vTab">${yen(sum(rows))}円</strong></div>
  </section>`;

  drawQueue(kind); showCapStatus();
  // 行の編集（自動保存・合計自動計算）
  body.querySelectorAll('tbody input').forEach(inp=>inp.addEventListener('input',()=>{
    const row = rows.find(x=>x.id===inp.dataset.id); if(!row) return;
    row[inp.dataset.f] = inp.dataset.f==='amount' ? toNum(inp.value) : inp.value;
    touch(r); updateTotals(r);
  }));
  body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    if(!(await askConfirm('この行を削除しますか？'))) return;
    r[kind] = rows.filter(x=>x.id!==b.dataset.rm); touch(r); render();
  });
  body.querySelectorAll('.thumb').forEach(img=>img.onclick=()=>{
    const m = document.getElementById('modal'); m.querySelector('img').src = img.src; m.style.display='flex';
  });
  document.getElementById('addRow').onclick = ()=>{
    rows.push({ id:uid(), item:'', amount:0, note:'', thumb:'', source:'manual' });
    touch(r); render();
    const inputs = document.querySelectorAll('tbody input[data-f="item"]'); inputs[inputs.length-1]?.focus();
  };

  // 画像の読み込み
  const handle = files => processFiles(r, kind, [...files]);
  document.getElementById('fileIn').onchange = e=>{ handle(e.target.files); e.target.value=''; };
  document.getElementById('camIn').onchange = e=>{ handle(e.target.files); e.target.value=''; };
  const drop = document.getElementById('drop');
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', ()=>drop.classList.remove('over'));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files); });
}

function rowHTML(row){
  return `<tr>
    <td>${row.thumb ? `<img class="thumb" src="${row.thumb}" alt="証憑">` : ''}</td>
    <td><input data-id="${row.id}" data-f="item" value="${esc(row.item)}" placeholder="項目"></td>
    <td><input data-id="${row.id}" data-f="amount" class="amt" inputmode="numeric" value="${row.amount ? row.amount : ''}" placeholder="0"></td>
    <td><input data-id="${row.id}" data-f="note" value="${esc(row.note)}" placeholder="備考（手入力）"></td>
    <td><span class="tag ${row.source==='auto'?'auto':''}">${row.source==='auto'?'自動':'手入力'}</span></td>
    <td><button class="btn ghost" data-rm="${row.id}" aria-label="行を削除">✕</button></td>
  </tr>`;
}

// 読み込みの進行状況（ページを描き直しても消えないように保持）
const queueLog = { income:[], expense:[] };
function drawQueue(kind){
  const q = document.getElementById('queue'); if(!q) return;
  q.innerHTML = queueLog[kind].map(x=>`<li>${x.state==='ok'?'<span class="ok">✓</span> ':x.state==='ng'?'<span class="ng">✕</span> ':'⏳ '}${esc(x.name)}：${esc(x.msg)}</li>`).join('');
}

async function processFiles(r, kind, files){
  if(!files.length){ toast('画像が選ばれていません'); return; }
  const entries = files.map(f=>{ const e = { name:f.name || '画像', state:'wait', msg:'順番待ち' }; queueLog[kind].unshift(e); return { f, e }; });
  drawQueue(kind);
  for(const { f, e } of entries){
    e.state = 'run'; e.msg = '読み取り中…（数十秒かかることがあります）'; drawQueue(kind);
    try{
      let toSend, thumb = '';
      try{
        const img = await fileToImage(f);
        toSend = resize(img, 1600, 0.85);
        thumb  = resize(img, 360, 0.6);
      }catch(err){
        // 端末で画像を開けない形式でも、対応形式ならそのままClaudeへ送る
        if(/^image\/(jpeg|png|webp|gif)$/i.test(f.type)) toSend = f;
        else throw new Error('この画像形式は開けません。カメラの設定を「互換性優先（JPEG）」にするか、スクリーンショットにして選び直してください。');
      }
      const res = await readReceipt(toSend, kind);
      const label = res.summary ? (res.issuer ? `${res.summary}（${res.issuer}）` : res.summary) : (res.issuer || '');
      const total = toNum(res.total) || sum((res.items||[]).map(i=>({amount:i.amount})));
      const row = { id:uid(), item:label, amount:total, note:'', thumb, source:'auto' };
      r[kind].push(row); touch(r);
      e.state = 'ok'; e.msg = `${row.item || '（項目名なし）'} ${yen(row.amount)}円 を記入しました`;
      if(document.getElementById('queue')) render();   // 表を更新
    }catch(err){
      console.error(err);
      e.state = 'ng'; e.msg = `${err.message}（手入力で追加することもできます）`;
    }
    drawQueue(kind);
  }
}

function fld(text, x, top, w, h, size, align=''){
  return `<div class="f ${align}" style="left:${x}pt;top:${top}pt;width:${w}pt;height:${h}pt;font-size:${size}pt"><span>${esc(text)}</span></div>`;
}

// 各ページに記入する文字と位置を計算（画面表示・PDF作成の両方で共通）
function sheetPages(r){
  const nIn = FORM.incomeRows.length, nOut = FORM.expenseRows.length;
  const pages = Math.max(1, Math.ceil(r.income.length/nIn), Math.ceil(r.expense.length/nOut));
  const tIn = sum(r.income), tOut = sum(r.expense);
  const amt = v => (v===''||v==null) ? '' : yen(v)+'円';
  const out = [];
  for(let p=0; p<pages; p++){
    const f = [];
    const add = (text,x,top,w,h,size,align='') => { if(String(text??'')!=='') f.push({text:String(text),x,top,w,h,size,align}); };
    add(r.year,   FORM.year.x,   FORM.year.top,   FORM.year.w,   FORM.year.h,   FORM.year.size,   'c');
    add(r.club,   FORM.club.x,   FORM.club.top,   FORM.club.w,   FORM.club.h,   FORM.club.size,   'c');
    add(r.leader, FORM.leader.x, FORM.leader.top, FORM.leader.w, FORM.leader.h, FORM.leader.size, 'c');
    const rowsOut = (list, tops, offset) => tops.forEach((top,i)=>{
      const row = list[offset+i]; if(!row) return;
      const C = FORM.cols, h = FORM.rowH, z = FORM.cellSize;
      add(row.item, C.item.x, top, C.item.w, h, z);
      add(amt(row.amount), C.amount.x, top, C.amount.w, h, z, 'r');
      add(row.note, C.note.x, top, C.note.w, h, z);
    });
    rowsOut(r.income,  FORM.incomeRows,  p*nIn);
    rowsOut(r.expense, FORM.expenseRows, p*nOut);
    if(p === pages-1){  // 合計・残高は最終ページに記入
      const T = FORM.totals;
      [tIn, tOut, tIn-tOut].forEach((v,i)=> add(yen(v), T.x, T.tops[i], T.w, T.h, T.size, 'r'));
    }
    out.push(f);
  }
  return out;
}

function renderSheet(r, body){
  const pages = sheetPages(r);
  const html = pages.map(f=>`<div class="page"><img class="bg" src="${FORM_BG}" alt="">${
    f.map(x=>fld(x.text,x.x,x.top,x.w,x.h,x.size,x.align)).join('')}</div>`).join('');

  body.innerHTML = `
  <div class="row-actions no-print" style="margin:0 0 8px">
    <button type="button" class="btn primary" id="pdfBtn">PDFで保存</button>
    <button type="button" class="btn" id="printBtn">印刷する</button>
  </div>
  <p class="note no-print" style="margin:0 0 12px">「PDFで保存」は原本と同じA4横のPDFを作ってダウンロードします。印刷はそのPDFから行うと確実です。「印刷する」を使う場合は「用紙：A4・横」「余白：なし」「倍率：100%」を選んでください。</p>
  ${pages.length>1 ? `<p class="pageinfo no-print">記入欄（収入4行・支出7行）を超えたため、同じ書式で${pages.length}枚に分けて記入しています。合計・残高は最後の1枚に記入されます。</p>` : ''}
  <div class="sheetwrap" id="sheetwrap">${html}</div>`;

  document.getElementById('pdfBtn').addEventListener('click', ()=>savePDF(r));
  document.getElementById('printBtn').addEventListener('click', doPrint);
  fitSheet(); fitTexts();
}

/* ---------- 印刷 ---------- */
function doPrint(){
  try{
    window.focus();
    window.print();
  }catch(e){
    toast('この画面では印刷画面を開けません。「PDFで保存」で保存したPDFから印刷してください。');
  }
}

/* ---------- PDF作成（原本と同じA4横） ---------- */
const MINCHO = '"MS Mincho","ＭＳ 明朝","Yu Mincho","游明朝","Hiragino Mincho ProN","Shippori Mincho",serif';
function loadScript(src){
  return new Promise((res,rej)=>{
    if(window.jspdf) return res();
    const sc = document.createElement('script');
    sc.src = src; sc.onload = ()=>res(); sc.onerror = ()=>rej(new Error('PDF作成ツールを読み込めませんでした（インターネット接続を確認してください）'));
    document.head.appendChild(sc);
  });
}
function loadImg(src){
  return new Promise((res,rej)=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src = src; });
}
// 1ページ分を300dpi相当の画像として描く
function drawPage(fields, bg){
  const W = 3508, H = 2480, k = W / 841.89;   // pt → px
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
  g.drawImage(bg, 0, 0, W, H);
  g.fillStyle = '#000'; g.textBaseline = 'middle';
  fields.forEach(f=>{
    let size = f.size;
    const maxW = f.w * k;
    g.font = `${size*k}px ${MINCHO}`;
    while(g.measureText(f.text).width > maxW && size > 6){ size -= 0.5; g.font = `${size*k}px ${MINCHO}`; }
    const tw = g.measureText(f.text).width;
    let x = f.x * k;
    if(f.align === 'c') x += (maxW - tw) / 2;
    else if(f.align === 'r') x += maxW - tw;
    g.fillText(f.text, x, (f.top + f.h/2) * k);
  });
  return c;
}
async function savePDF(r){
  const btn = document.getElementById('pdfBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'PDFを作成中…'; }
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const bg = await loadImg(FORM_BG);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    sheetPages(r).forEach((fields, i)=>{
      if(i > 0) doc.addPage('a4', 'landscape');
      const img = drawPage(fields, bg).toDataURL('image/jpeg', 0.92);
      doc.addImage(img, 'JPEG', 0, 0, 841.89, 595.28);
    });
    const name = `${r.year||''}年度_${r.club||''}部_収支報告書.pdf`;
    await saveFile(name, doc.output('blob'));
  }catch(e){
    console.error(e);
    toast(e.message || 'PDFを作成できませんでした。index.htmlをブラウザで直接開いて試してください。');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'PDFで保存'; }
  }
}

// 画面幅に合わせて縮小表示（印刷時は原寸）
function fitSheet(){
  const wrap = document.getElementById('sheetwrap'); if(!wrap) return;
  const pages = wrap.querySelectorAll('.page'); if(!pages.length) return;
  const pw = pages[0].offsetWidth, ph = pages[0].offsetHeight;
  const sc = Math.min(1, wrap.clientWidth / pw);
  pages.forEach(pg=>{ pg.style.transform = `scale(${sc})`; pg.style.marginBottom = `${16 - ph*(1-sc)}px`; });
  wrap.style.height = `${pages.length*(ph*sc+16)}px`;
}
// 欄からはみ出す文字は自動で文字サイズを小さくする
function fitTexts(){
  document.querySelectorAll('.page .f').forEach(box=>{
    const sp = box.firstElementChild; if(!sp) return;
    let size = parseFloat(box.style.fontSize);
    while(sp.scrollWidth > box.clientWidth && size > 6){ size -= 0.5; box.style.fontSize = size+'pt'; }
  });
}
window.addEventListener('resize', fitSheet);

/* ---------- 設定・バックアップ ---------- */
function renderSettings(){
  app.innerHTML = `
  <section class="panel">
    <h2 style="margin:0 0 8px;font-size:1.1rem">バックアップ</h2>
    <p class="note">画像の読み取りは自動で設定済みです。ここでは報告書データの書き出し・読み込みができます。ブラウザのデータを消去すると報告書も消えるため、年度末などに書き出しておくと安心です。</p>
    <div class="row-actions">
      <button type="button" class="btn" id="exp">全データを書き出す</button>
      <button type="button" class="btn" id="imp">バックアップから読み込む</button>
    </div>
  </section>`;
  document.getElementById('exp').onclick = async ()=>{
    const json = JSON.stringify({ reports: db.reports });
    const name = `収支報告書_backup_${new Date().toISOString().slice(0,10)}.json`;
    await saveFile(name, new Blob([json], {type:'application/json'}));
  };
  const fi = document.getElementById('importFile');
  document.getElementById('imp').onclick = ()=>fi.click();
  fi.onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      Object.assign(db.reports, d.reports||{}); saveDB(); toast('バックアップを読み込みました');
      go('home');
    }catch(err){ toast('ファイルを読み込めませんでした'); }
    fi.value='';
  };
}

// ファイルの保存（Claudeで開いている場合は保存確認画面を経由）
async function saveFile(name, blob){
  const dl = await getCap('downloads');
  if(dl){
    try{ await dl.save({ filename:name, data:blob }); toast('保存しました'); return true; }
    catch(e){
      if(e && e.code === 'declined') { toast('保存をキャンセルしました'); return false; }
      if(e && e.code === 'rate_limited'){ toast('少し待ってからもう一度押してください'); return false; }
    }
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('保存しました'); return true;
  }catch(e){ toast('この画面では保存できませんでした'); return false; }
}
